---
# Source: cloud-optimizer/templates/deployment-dashboard.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-optimizer-dashboard
  labels:
    helm.sh/chart: cloud-optimizer-1.0.0
    app.kubernetes.io/name: cloud-optimizer
    app.kubernetes.io/instance: cloud-optimizer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cloud-optimizer
    app.kubernetes.io/component: analytics-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-optimizer
      app.kubernetes.io/instance: cloud-optimizer
      app.kubernetes.io/component: analytics-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-optimizer
        app.kubernetes.io/instance: cloud-optimizer
        app.kubernetes.io/component: analytics-dashboard
    spec:
      containers:
        - name: dashboard
          image: "cloudopt-dashboard:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: cloud-optimizer-config
                  key: API_URL
            - name: DASHBOARD_HOST
              value: "0.0.0.0"
            - name: DASHBOARD_PORT
              value: "8501"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3

