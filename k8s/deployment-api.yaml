---
# Source: cloud-optimizer/templates/deployment-api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-optimizer-api
  labels:
    helm.sh/chart: cloud-optimizer-1.0.0
    app.kubernetes.io/name: cloud-optimizer
    app.kubernetes.io/instance: cloud-optimizer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cloud-optimizer
    app.kubernetes.io/component: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-optimizer
      app.kubernetes.io/instance: cloud-optimizer
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-optimizer
        app.kubernetes.io/instance: cloud-optimizer
        app.kubernetes.io/component: backend-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: "cloudopt-api:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cloud-optimizer-config
            - secretRef:
                name: cloud-optimizer-secret
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3

