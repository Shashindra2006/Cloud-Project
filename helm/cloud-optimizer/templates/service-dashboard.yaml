apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-optimizer.fullname" . }}-dashboard
  labels:
    {{- include "cloud-optimizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.dashboard.service.type "NodePort") .Values.dashboard.service.nodePort }}
      nodePort: {{ .Values.dashboard.service.nodePort }}
      {{- end }}
  selector:
    {{- include "cloud-optimizer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-dashboard
