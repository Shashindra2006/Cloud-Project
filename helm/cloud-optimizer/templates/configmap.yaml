apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-optimizer.fullname" . }}-config
  labels:
    {{- include "cloud-optimizer.labels" . | nindent 4 }}
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_DEBUG: {{ .Values.api.env.API_DEBUG | quote }}
  OPTIMIZER_DRY_RUN: {{ .Values.api.env.OPTIMIZER_DRY_RUN | quote }}
  OPTIMIZER_MIN_REPLICAS: {{ .Values.api.env.OPTIMIZER_MIN_REPLICAS | quote }}
  OPTIMIZER_MAX_REPLICAS: {{ .Values.api.env.OPTIMIZER_MAX_REPLICAS | quote }}
  OPTIMIZER_COOLDOWN_SECONDS: {{ .Values.api.env.OPTIMIZER_COOLDOWN_SECONDS | quote }}
  OPTIMIZER_SAFETY_MARGIN: {{ .Values.api.env.OPTIMIZER_SAFETY_MARGIN | quote }}
  POSTGRES_HOST: {{ include "cloud-optimizer.fullname" . }}-db
  POSTGRES_PORT: {{ .Values.postgresql.service.port | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  API_URL: "http://{{ include "cloud-optimizer.fullname" . }}-api:{{ .Values.api.service.port }}"
