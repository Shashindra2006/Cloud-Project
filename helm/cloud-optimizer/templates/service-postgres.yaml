{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-optimizer.fullname" . }}-db
  labels:
    {{- include "cloud-optimizer.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "cloud-optimizer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
{{- end }}
