global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "cloud-optimizer-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "cloud-optimizer-backend"

  - job_name: "cloud-optimizer-workload"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["workload:8080"]
        labels:
          environment: "production"
          service: "cloud-optimizer-workload"
