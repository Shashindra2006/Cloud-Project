name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    name: Lint & Automated Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov httpx
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy psycopg2-binary
          pip install scikit-learn pandas numpy joblib prometheus-client requests streamlit plotly python-dotenv

      - name: Lint check with Ruff
        run: |
          ruff check . --ignore E501,F401,F841 || true

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov=ml --cov=optimizer --cov=cost_engine --cov-report=term-missing

      - name: Verify Experiment Runner
        run: |
          python experiments/run_experiment.py --duration 15 --step-interval 1 --scenario spike --seed 42 --results-dir ./test_results
